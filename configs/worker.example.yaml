# Local DeepSeek-simulator worker configuration. Credentials are environment
# variable names, never checked-in secret values.
mode: local
worker:
  concurrency: 1
  reasoner:
    role: async_gpt_5_5
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
store:
  database_url_env: DATABASE_URL
safety:
  policy_version: static-v1
  mode: enforce
  privacy_hmac_key_env: LIVE_PRIVACY_HMAC_KEY
  max_summary_bytes: 16384
  max_structured_bytes: 65536
  redacted_summary: A background task completed with protected details removed.
  clarification_prompt: Approval is required before this task can continue.
  redaction_denied_keys: []
shutdown:
  drain_timeout: 10s
features:
  side_effecting_tools: true
  tool_encryption_key_env: LIVE_TOOL_ENCRYPTION_KEY
  # Immutable identifier stored with ciphertext. Keep old key IDs and keys
  # available to the separate decryptor when rotating; workers only encrypt.
  tool_encryption_key_id: local-v1
