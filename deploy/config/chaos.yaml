# Disposable Task 24 topology only. All upstreams terminate inside Compose.
mode: production
gateway:
  advertised_model: gpt-live-chaos
  listen_addr: :8080
  voice:
    role: realtime_voice
    provider: speech_to_speech
    url: wss://chaos-edge:8443/voice/v1/realtime
    model: fake-realtime
    api_key_env: S2S_API_KEY
  audio: {sample_rate: 24000, channels: 1, bytes_per_sample: 2}
  storage_grace: 30s
  reconnect:
    max_retries: 2
    retry_base: 100ms
    retry_max: 1s
    hmac_key_env: LIVE_RECONNECT_HMAC_KEY
    hmac_key_id: chaos-reconnect-v1
    credential_ttl: 5m
  behind_ingress: true
  trusted_proxies: [0.0.0.0/0]
store:
  database_url_env: DATABASE_URL
  retention:
    conversation_ttl: 720h
    sweep_interval: 1m
    deletion_batch: 100
    approval_ttl: 5m
    hmac_key_env: LIVE_RETENTION_HMAC_KEY
    hmac_key_id: chaos-retention-v1
auth:
  oidc_issuer: https://chaos-edge:8443/oidc
  oidc_audience: gpt-live-chaos
  oidc_required_scopes: [realtime]
  allowed_origins: [http://127.0.0.1:3000]
admission: {max_sessions: 250, max_sessions_per_tenant: 250, max_sessions_per_user: 250, instance_id: task24-chaos-gateway}
safety: {policy_version: static-v1, mode: enforce, privacy_hmac_key_env: LIVE_PRIVACY_HMAC_KEY}
telemetry: {service_name: gpt-live-chaos, protocol: http/protobuf, otlp_endpoint: https://chaos-edge:8443/otel}
admin: {listen_addr: "127.0.0.1:9090"}
shutdown: {gateway_drain_timeout: 30s, worker_drain_timeout: 120s, cleanup_timeout: 5s}
worker:
  concurrency: 4
  # Deliberately short, bounded timings make killed-worker lease recovery
  # observable inside the disposable chaos test deadline.
  lease_duration: 2s
  heartbeat_interval: 500ms
  poll_interval: 100ms
  request_timeout: 10s
  retry_base: 100ms
  retry_max: 3s
  max_retries: 5
  max_output_bytes: 1048576
  max_tool_rounds: 8
  reasoner:
    role: async_gpt_5_5
    provider: deepseek
    base_url: https://chaos-edge:8443/deepseek/v1
    model: fake-deepseek
    api_key_env: DEEPSEEK_API_KEY
features: {handoffs: true, side_effecting_tools: true, tool_encryption_key_env: LIVE_TOOL_ENCRYPTION_KEY, tool_encryption_key_id: chaos-tools-v1, runtime_refresh_interval: 1s}
