name: gpt-live-durable-demo

services:
  migrate:
    environment:
      DATABASE_URL: postgres://live:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/live?sslmode=disable

  gateway:
    environment:
      DATABASE_URL: postgres://live:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/live?sslmode=disable
      S2S_API_KEY: ${S2S_API_KEY:?S2S_API_KEY is required}
      LIVE_STATIC_BEARER_TOKEN: ${LIVE_STATIC_BEARER_TOKEN:?LIVE_STATIC_BEARER_TOKEN is required}
      LIVE_ADMIN_BEARER_TOKEN: ${LIVE_ADMIN_BEARER_TOKEN:?LIVE_ADMIN_BEARER_TOKEN is required}
      LIVE_PRIVACY_HMAC_KEY: ${LIVE_PRIVACY_HMAC_KEY:?LIVE_PRIVACY_HMAC_KEY is required}
      LIVE_RETENTION_HMAC_KEY: ${LIVE_RETENTION_HMAC_KEY:?LIVE_RETENTION_HMAC_KEY is required}
      LIVE_RECONNECT_HMAC_KEY: ${LIVE_RECONNECT_HMAC_KEY:?LIVE_RECONNECT_HMAC_KEY is required}
      LIVE_TOOL_ENCRYPTION_KEY: ${LIVE_TOOL_ENCRYPTION_KEY:?LIVE_TOOL_ENCRYPTION_KEY is required}
      LIVE_EXPECTED_CONFIG_HASH: ${LIVE_EXPECTED_CONFIG_HASH:?LIVE_EXPECTED_CONFIG_HASH is required}
    volumes:
      - ./config/development-durable.yaml:/etc/live/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      speech-to-speech:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
      - "127.0.0.1:${GATEWAY_HEALTH_PORT:-19090}:9090"
    read_only: true

  worker:
    environment:
      DATABASE_URL: postgres://live:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/live?sslmode=disable
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      LIVE_STATIC_BEARER_TOKEN: ${LIVE_STATIC_BEARER_TOKEN:?LIVE_STATIC_BEARER_TOKEN is required}
      LIVE_ADMIN_BEARER_TOKEN: ${LIVE_ADMIN_BEARER_TOKEN:?LIVE_ADMIN_BEARER_TOKEN is required}
      LIVE_PRIVACY_HMAC_KEY: ${LIVE_PRIVACY_HMAC_KEY:?LIVE_PRIVACY_HMAC_KEY is required}
      LIVE_RETENTION_HMAC_KEY: ${LIVE_RETENTION_HMAC_KEY:?LIVE_RETENTION_HMAC_KEY is required}
      LIVE_TOOL_ENCRYPTION_KEY: ${LIVE_TOOL_ENCRYPTION_KEY:?LIVE_TOOL_ENCRYPTION_KEY is required}
      LIVE_EXPECTED_CONFIG_HASH: ${LIVE_EXPECTED_CONFIG_HASH:?LIVE_EXPECTED_CONFIG_HASH is required}
    volumes:
      - ./config/development-durable.yaml:/etc/live/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-19091}:9090"
    read_only: true
