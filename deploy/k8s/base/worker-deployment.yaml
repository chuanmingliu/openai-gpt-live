apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-worker
  labels:
    app.kubernetes.io/name: live-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: gpt-live
    topology.kubernetes.io/region: PRODUCTION_DEPLOYMENT_REGION
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: live-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: gpt-live
        topology.kubernetes.io/region: PRODUCTION_DEPLOYMENT_REGION
      annotations:
        live.openai.com/config-hash: CONFIG_HASH_REPLACED_BY_KUSTOMIZE
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 135
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: live-worker
      containers:
        - name: live-worker
          image: live-worker:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/live/config.yaml"]
          ports: [{name: metrics, protocol: TCP, containerPort: 9091}]
          env:
            - name: LIVE_DEPLOYMENT_REGION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/region']
            - {name: LIVE_ALLOWED_REGIONS, value: PRODUCTION_DEPLOYMENT_REGION}
            - name: LIVE_EXPECTED_CONFIG_HASH
              value: CONFIG_HASH_REPLACED_BY_KUSTOMIZE
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: live-secrets, key: DATABASE_URL}}
            - name: DEEPSEEK_API_KEY
              valueFrom: {secretKeyRef: {name: live-secrets, key: DEEPSEEK_API_KEY}}
            - name: LIVE_ADMIN_BEARER_TOKEN
              valueFrom: {secretKeyRef: {name: live-secrets, key: LIVE_ADMIN_BEARER_TOKEN}}
            - name: LIVE_PRIVACY_HMAC_KEY
              valueFrom: {secretKeyRef: {name: live-secrets, key: LIVE_PRIVACY_HMAC_KEY}}
            - name: LIVE_RETENTION_HMAC_KEY
              valueFrom: {secretKeyRef: {name: live-secrets, key: LIVE_RETENTION_HMAC_KEY}}
            - name: LIVE_TOOL_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: live-secrets, key: LIVE_TOOL_ENCRYPTION_KEY}}
          volumeMounts:
            - name: config
              mountPath: /etc/live/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            exec:
              command: ["/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health/ready"]
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health/live"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health/live"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/usr/local/bin/live-prestop", "--health-port", "9090", "--budget", "125s"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: live-config
            items:
              - key: config.yaml
                path: config.yaml
