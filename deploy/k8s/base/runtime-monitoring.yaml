apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: live-runtime
  labels: {app.kubernetes.io/part-of: gpt-live}
spec:
  selector:
    matchLabels: {app.kubernetes.io/part-of: gpt-live}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [gateway, worker]}
  podMetricsEndpoints:
    - {port: metrics, path: /metrics, interval: 30s, honorLabels: true}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-metrics-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: gpt-live}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [gateway, worker]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 9091}]
