apiVersion: batch/v1
kind: Job
metadata:
  name: live-migrate
  labels:
    app.kubernetes.io/name: live-migrate
    app.kubernetes.io/part-of: gpt-live
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-migrate
        app.kubernetes.io/part-of: gpt-live
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: live-migrate
          image: live-migrate:dev
          args: ["-direction", "up"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: live-secrets, key: DATABASE_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
