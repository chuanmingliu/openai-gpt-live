apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-egress
  namespace: gpt-live
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: live-migrate
  policyTypes: [Egress]
  egress:
    # Schema migration needs only cluster DNS and PostgreSQL. It does not call
    # OIDC, telemetry, speech, model, or general Internet endpoints.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gpt-live}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports:
        - {protocol: TCP, port: 5432}
