apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: live-gateway}
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: live-worker}
  minReplicas: 2
  maxReplicas: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
