apiVersion: v1
kind: ConfigMap
metadata:
  name: live-deploy-metadata
data:
  config-hash: v1:01325caae8753b2a548e8ee9cd4b228bacdb13995b69a626109ca0f71b4690e3
  render-readiness: local
  production-host: ""
  tls-secret: ""
  egress-proxy-cidr: ""
  trusted-proxy-cidr: ""
  https-proxy: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-gateway
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-worker
spec:
  replicas: 1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-gateway
spec:
  minReplicas: 1
  maxReplicas: 4
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-worker
spec:
  minReplicas: 1
  maxReplicas: 4
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gpt-live}
          podSelector:
            matchLabels: {app.kubernetes.io/part-of: gpt-live}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-egress
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gpt-live}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gpt-live}
          podSelector:
            matchLabels: {app.kubernetes.io/name: speech-to-speech}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: identity}
          podSelector:
            matchLabels: {app.kubernetes.io/name: oidc}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: otel-collector}
      ports: [{protocol: TCP, port: 4318}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
spec:
  template:
    spec:
      containers:
        - name: live-gateway
          env:
            - name: LIVE_STATIC_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: live-secrets
                  key: LIVE_STATIC_BEARER_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-synthetic-canary
spec:
  template:
    spec:
      containers:
        - name: canary
          env:
            - {name: LIVE_CANARY_GATEWAY_URL, value: "ws://live-gateway.gpt-live.svc/v1/realtime"}
            - {name: LIVE_CANARY_ORIGIN, value: "http://localhost:3000"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthetic-canary
spec:
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: live-gateway}}
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-worker
spec:
  template:
    spec:
      containers:
        - name: live-worker
          env:
            - name: LIVE_STATIC_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: live-secrets
                  key: LIVE_STATIC_BEARER_TOKEN
